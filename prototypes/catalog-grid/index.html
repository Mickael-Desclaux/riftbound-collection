<!-- PROTOTYPE JETABLE — ticket « Prototype de la grille Catalogue : recherche, filtres, pagination ».
     Trois variantes de l'onglet Catalogue, choisies par ?variant=A|B|C et la barre flottante (← →).
     Données réelles RiftHunt + Cardmarket du 2026-11-07, embarquées. Rien n'est persisté. -->
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype grille Catalogue</title>
<style>
  :root {
    --bg: #0d1017; --surface: #161b26; --surface2: #1f2533; --text: #e9ecf3; --muted: #8b93a7;
    --accent: #e0b44c; --accent-ink: #1a1405; --line: #2a3142; --good: #4fbf7f; --bad: #e46a6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #05070b; color: var(--text); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .phone { max-width: 420px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; padding-bottom: 140px; }
  .appbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  .appbar h1 { font-size: 20px; margin: 0 0 8px; }
  .search { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
  .row { display: flex; gap: 8px; align-items: center; }
  .btn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .muted { color: var(--muted); font-size: 13px; }
  .price { font-weight: 700; color: var(--accent); }
  .up { color: var(--good); } .down { color: var(--bad); }
  img.art { display: block; width: 100%; aspect-ratio: 744/1039; object-fit: cover; background: var(--surface2); border-radius: 8px; }
  .pager { display: flex; gap: 4px; justify-content: center; align-items: center; padding: 16px; flex-wrap: wrap; }
  .pager button { min-width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
  .pager button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .pager button:disabled { opacity: .35; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  /* Feuille / tiroir de filtres */
  .scrim { position: fixed; inset: 0; background: #0009; z-index: 20; }
  .sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 420px; max-height: 82vh; overflow: auto; background: var(--surface); border-radius: 18px 18px 0 0; z-index: 21; padding: 16px 16px 90px; }
  .drawer { position: fixed; top: 0; bottom: 0; right: max(0px, calc(50% - 210px)); width: 86%; max-width: 360px; overflow: auto; background: var(--surface); z-index: 21; padding: 16px 16px 90px; }
  .sheet h3, .drawer h3 { margin: 16px 0 6px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; display: flex; background: var(--surface); border-top: 1px solid var(--line); z-index: 6; }
  .tabs div { flex: 1; text-align: center; padding: 10px 0 12px; font-size: 12px; color: var(--muted); }
  .tabs div.on { color: var(--accent); font-weight: 600; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 130px; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; z-index: 40; font-size: 14px; }
  /* Barre du prototype : hors design évalué */
  .proto { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 6px; align-items: center; background: #fff; color: #111; padding: 6px 8px; border-radius: 999px; box-shadow: 0 4px 18px #000a; font-size: 13px; white-space: nowrap; }
  .proto button, .proto select { border: 0; background: #eee; border-radius: 999px; padding: 4px 9px; color: #111; }
  .state { position: fixed; top: 0; right: 0; z-index: 31; max-width: 260px; background: #fff; color: #111; font: 11px/1.3 ui-monospace, monospace; padding: 6px 8px; border-bottom-left-radius: 8px; opacity: .9; white-space: pre-wrap; }
  @media (max-width: 900px) { .state { display: none; } }
  /* Variante A */
  .gridA { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
  .cardA { position: relative; background: var(--surface); border-radius: 12px; padding: 6px; }
  .cardA .name { font-weight: 600; font-size: 13px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cardA .meta { display: flex; justify-content: space-between; font-size: 12px; }
  .qa { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
  .qa button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #000b; color: #fff; font-size: 15px; }
  .qa button.on { background: var(--accent); color: var(--accent-ink); }
  .owned-badge { position: absolute; top: 10px; left: 10px; background: var(--good); color: #041; font-weight: 700; font-size: 12px; padding: 2px 7px; border-radius: 999px; }
  /* Variante B */
  .listB { padding: 4px 0; }
  .rowB { display: flex; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); align-items: center; }
  .rowB img { width: 46px; aspect-ratio: 744/1039; border-radius: 4px; object-fit: cover; background: var(--surface2); flex: none; }
  .rowB .mid { flex: 1; min-width: 0; }
  .rowB .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rowB .right { text-align: right; }
  .stepper { display: flex; align-items: center; gap: 2px; margin-top: 4px; justify-content: flex-end; }
  .stepper button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); padding: 0; }
  .stepper span { min-width: 18px; text-align: center; font-size: 13px; }
  /* Variante C */
  .setsC { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .setC { flex: none; width: 96px; padding: 8px; border-radius: 12px; background: var(--surface); border: 2px solid transparent; text-align: left; }
  .setC.on { border-color: var(--accent); }
  .setC b { display: block; font-size: 16px; } .setC small { color: var(--muted); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gridC { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 10px; }
  .cardC { position: relative; border: 0; padding: 0; background: none; text-align: left; }
  .cardC img.art { border-radius: 6px; }
  .cardC .tag { position: absolute; left: 4px; right: 4px; bottom: 4px; display: flex; justify-content: space-between; background: #000c; border-radius: 4px; padding: 2px 5px; font-size: 11px; }
  .cardC .dot { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; }
  .cardC .dot span { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
</style>
</head>

79cd991b4cc","usd":0.05,"eur":0.09,"chg":-18.0},{"c":"VEN-079","n":"Dame the Despoiler","s":"VEN","r":"uncommon","t":"Unit","d":["body"],"v":null,"f":["normal","foil"],"img":"front/ven/079/dame-the-despoiler.webp?v=ca29e99d332c","usd":0.05,"eur":0.08,"chg":0.2},{"c":"VEN-080","n":"Noxian Demolitionist","s":"VEN","r":"uncommon","t":"Unit","d":["body"],"v":null,"f":["normal","foil"],"img":"front/ven/080/noxian-demolitionist.webp?v=cb77a76bc6bd","usd":0.08,"eur":0.11,"chg":-9.6},{"c":"VEN-081","n":"Onslaught","s":"VEN","r":"uncommon","t":"Spell","d":["body"],"v":null,"f":["normal","foil"],"img":"front/ven/081/onslaught.webp?v=9477dcca31bd","usd":0.13,"eur":0.13,"chg":-4.9},{"c":"VEN-082","n":"Profiteer","s":"VEN","r":"uncommon","t":"Unit","d":["body"],"v":null,"f":["normal","foil"],"img":"front/ven/082/profiteer.webp?v=63b47183fba1","usd":0.07,"eur":0.08,"chg":12.4},{"c":"VEN-083","n":"Rampage","s":"VEN","r":"uncommon","t":"Spell","d":["body"],"v":null,"f":["normal","foil"],"img":"front/ven/083/rampage.webp?v=e6d216bd5e3a","usd":0.28,"eur":0.28,"chg":13.7},{"c":"VEN-084","n":"Ambessa, The Wolf","s":"VEN","r":"rare","t":"Unit","d":["body"],"v":null,"f":["foil"],"img":"front/ven/084/ambessa-the-wolf.webp?v=04a650becbf9","usd":0.16,"eur":0.24,"chg":19.8}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const IMG = "https://images.rifthunt.com/cards/";
const PAGE_SIZE = 24;
const RATES_FROM_USD = { USD: 1, CAD: 1.4066, EUR: 0.89566 }; // Frankfurter, 2026-11-06
const CUR_LABEL = { CAD: "$ CA", USD: "$ US", EUR: "€" };
const VARIANTS = { A: "Grille + feuille de filtres", B: "Liste dense + puces", C: "Extension d'abord" };
const RARITIES = ["common", "uncommon", "rare", "epic", "showcase", "promo"];
const RAR_FR = { common: "Commune", uncommon: "Peu commune", rare: "Rare", epic: "Épique", showcase: "Showcase", promo: "Promo" };
const VERS_FR = { base: "Normale", alternate: "Alternative", overnumbered: "Overnumbered", signature: "Signée", metal: "Metal" };
const TYPES = [...new Set(DATA.printings.map((p) => p.t))].sort();
const DOMAINS = [...new Set(DATA.printings.flatMap((p) => p.d))].sort();
const SORTS = { num: "Numéro", name: "Nom", priceDesc: "Prix ↓", priceAsc: "Prix ↑", chg7: "Variation 7 j (simulée)" };

// ---- État (en mémoire seulement) ----
const params = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS[params.get("variant")] ? params.get("variant") : "A",
  currency: "CAD", source: "tcgplayer",
  q: "", sets: new Set(), showPromos: false, rarities: new Set(), versions: new Set(), types: new Set(), domains: new Set(),
  owned: "all", priceMin: "", priceMax: "", sort: "num", page: 1,
  panelOpen: false, collection: new Map(), wishlist: new Set(), searchOpen: false,
};

// ---- Logique (qui ira dans domain/) ----
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function nativePrice(p) { return state.source === "tcgplayer" ? p.usd : p.eur; }
function displayPrice(p) {
  const v = nativePrice(p); if (v == null) return null;
  const usd = state.source === "tcgplayer" ? v : v / RATES_FROM_USD.EUR;
  return usd * RATES_FROM_USD[state.currency];
}
function fmt(v) { return v == null ? "—" : v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + CUR_LABEL[state.currency]; }
const versionOf = (p) => p.v || "base";
const promoSet = new Set(DATA.sets.filter((s) => s.promo).map((s) => s.code));
function filtered() {
  const q = norm(state.q.trim());
  const min = parseFloat(state.priceMin.replace(",", ".")), max = parseFloat(state.priceMax.replace(",", "."));
  let list = DATA.printings.filter((p) => {
    if (!state.showPromos && promoSet.has(p.s) && !state.sets.has(p.s)) return false;
    if (state.sets.size && !state.sets.has(p.s)) return false;
    if (q && !norm(p.n).includes(q) && !norm(p.c).includes(q)) return false;
    if (state.rarities.size && !state.rarities.has(p.r)) return false;
    if (state.versions.size && !state.versions.has(versionOf(p))) return false;
    if (state.types.size && !state.types.has(p.t)) return false;
    if (state.domains.size && !p.d.some((d) => state.domains.has(d))) return false;
    const qty = state.collection.get(p.c) || 0;
    if (state.owned === "owned" && !qty) return false;
    if (state.owned === "missing" && qty) return false;
    const dp = displayPrice(p);
    if (!isNaN(min) && (dp == null || dp < min)) return false;
    if (!isNaN(max) && (dp == null || dp > max)) return false;
    return true;
  });
  const byNum = (a, b) => a.c.localeCompare(b.c, "en", { numeric: true });
  const nullLast = (f) => (a, b) => { const x = f(a), y = f(b); if (x == null && y == null) return byNum(a, b); if (x == null) return 1; if (y == null) return -1; return 0; };
  const cmp = {
    num: byNum,
    name: (a, b) => a.n.localeCompare(b.n, "fr") || byNum(a, b),
    priceDesc: (a, b) => nullLast(displayPrice)(a, b) || displayPrice(b) - displayPrice(a),
    priceAsc: (a, b) => nullLast(displayPrice)(a, b) || displayPrice(a) - displayPrice(b),
    chg7: (a, b) => b.chg - a.chg,
  }[state.sort];
  return list.sort(cmp);
}
function activeFilterCount() {
  return state.sets.size + state.rarities.size + state.versions.size + state.types.size + state.domains.size +
    (state.owned !== "all" ? 1 : 0) + (state.priceMin || state.priceMax ? 1 : 0) + (state.showPromos ? 1 : 0);
}
function resetFilters() {
  ["sets", "rarities", "versions", "types", "domains"].forEach((k) => state[k].clear());
  state.owned = "all"; state.priceMin = state.priceMax = ""; state.showPromos = false; state.page = 1;
}

// ---- Petits rendus partagés ----
const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const img = (p, size = "normal") => `<img class="art" loading="lazy" alt="${h(p.n)}" src="${IMG}${size}/${p.img}">`;
function chg(p) { const c = p.chg; return `<span class="${c >= 0 ? "up" : "down"}">${c >= 0 ? "+" : ""}${c.toLocaleString("fr-FR")} %</span>`; }
function pager(total) {
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE)), cur = state.page;
  const nums = new Set([1, pages, cur - 1, cur, cur + 1].filter((n) => n >= 1 && n <= pages));
  let out = `<button data-page="${cur - 1}" ${cur === 1 ? "disabled" : ""}>‹</button>`, prev = 0;
  [...nums].sort((a, b) => a - b).forEach((n) => { if (n - prev > 1) out += `<span class="muted">…</span>`; out += `<button data-page="${n}" class="${n === cur ? "on" : ""}">${n}</button>`; prev = n; });
  return `<div class="pager">${out}<button data-page="${cur + 1}" ${cur === pages ? "disabled" : ""}>›</button></div>`;
}
function pageSlice(list) {
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (state.page > pages) state.page = pages;
  return list.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
}
function chipGroup(key, values, label = (v) => v) {
  return `<div class="wrap">${values.map((v) => `<button class="chip ${state[key].has(v) ? "on" : ""}" data-toggle="${key}" data-value="${h(v)}">${h(label(v))}</button>`).join("")}</div>`;
}
function filterPanelBody() {
  const mainSets = DATA.sets.filter((s) => !s.promo), promoSets = DATA.sets.filter((s) => s.promo);
  return `
    <div class="row" style="justify-content:space-between"><b style="font-size:17px">Filtres</b><button class="btn" data-action="reset">Réinitialiser</button></div>
    <h3>Extension</h3>${chipGroup("sets", mainSets.map((s) => s.code), (c) => DATA.sets.find((s) => s.code === c).name)}
    <label class="row muted" style="margin-top:8px"><input type="checkbox" data-action="promos" ${state.showPromos ? "checked" : ""}> Afficher les extensions promo</label>
    ${state.showPromos ? `<div style="margin-top:6px">${chipGroup("sets", promoSets.map((s) => s.code), (c) => c)}</div>` : ""}
    <h3>Rareté</h3>${chipGroup("rarities", RARITIES, (r) => RAR_FR[r])}
    <h3>Version</h3>${chipGroup("versions", Object.keys(VERS_FR), (v) => VERS_FR[v])}
    <h3>Type</h3>${chipGroup("types", TYPES)}
    <h3>Domaine</h3>${chipGroup("domains", DOMAINS, (d) => d[0].toUpperCase() + d.slice(1))}
    <h3>Collection</h3><div class="wrap">${[["all", "Toutes"], ["owned", "Possédées"], ["missing", "Manquantes"]].map(([k, l]) => `<button class="chip ${state.owned === k ? "on" : ""}" data-owned="${k}">${l}</button>`).join("")}</div>
    <h3>Prix (${CUR_LABEL[state.currency]})</h3>
    <div class="row"><input class="search" inputmode="decimal" placeholder="min" data-input="priceMin" value="${h(state.priceMin)}"><input class="search" inputmode="decimal" placeholder="max" data-input="priceMax" value="${h(state.priceMax)}"></div>
    <div style="margin-top:16px"><button class="btn primary" style="width:100%" data-action="close">Voir ${filtered().length} versions</button></div>`;
}
function sortSelect() {
  return `<select class="btn" data-input="sort">${Object.entries(SORTS).map(([k, l]) => `<option value="${k}" ${state.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select>`;
}
function activeChips() {
  const chips = [];
  state.sets.forEach((v) => chips.push(["sets", v, v]));
  state.rarities.forEach((v) => chips.push(["rarities", v, RAR_FR[v]]));
  state.versions.forEach((v) => chips.push(["versions", v, VERS_FR[v]]));
  state.types.forEach((v) => chips.push(["types", v, v]));
  state.domains.forEach((v) => chips.push(["domains", v, v]));
  if (!chips.length) return "";
  return `<div class="chips">${chips.map(([k, v, l]) => `<button class="chip on" data-toggle="${k}" data-value="${h(v)}">${h(l)} ✕</button>`).join("")}</div>`;
}

// ---- Variante A : grille 2 colonnes, feuille de filtres en bas ----
function renderA() {
  const list = filtered(), slice = pageSlice(list), n = activeFilterCount();
  return `
  <div class="appbar"><h1>Catalogue</h1>
    <input class="search" placeholder="Rechercher une carte…" data-input="q" value="${h(state.q)}">
    <div class="row" style="margin-top:8px"><button class="btn" data-action="open">⚙︎ Filtres${n ? ` (${n})` : ""}</button>${sortSelect()}<span class="muted" style="margin-left:auto">${list.length} versions</span></div>
    ${activeChips()}
  </div>
  ${slice.length ? `<div class="gridA">${slice.map((p) => {
    const qty = state.collection.get(p.c) || 0;
    return `<div class="cardA" data-open="${h(p.c)}">${img(p)}
      ${qty ? `<span class="owned-badge">×${qty}</span>` : ""}
      <div class="qa"><button class="${qty ? "on" : ""}" data-own="${h(p.c)}" title="Possédée +1">✓</button><button class="${state.wishlist.has(p.c) ? "on" : ""}" data-wish="${h(p.c)}" title="Souhait">♡</button></div>
      <div class="name">${h(p.n)}</div>
      <div class="meta"><span class="muted">${h(p.c)}</span><span class="price">${fmt(displayPrice(p))}</span></div></div>`;
  }).join("")}</div>` : `<div class="empty">Aucune version ne correspond.<br><button class="btn" data-action="reset">Effacer les filtres</button></div>`}
  ${pager(list.length)}
  ${state.panelOpen ? `<div class="scrim" data-action="close"></div><div class="sheet">${filterPanelBody()}</div>` : ""}`;
}

// ---- Variante B : liste dense, puces d'extension, actions dans la ligne ----
function renderB() {
  const list = filtered(), slice = pageSlice(list), n = activeFilterCount();
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  const mainSets = DATA.sets.filter((s) => !s.promo);
  return `
  <div class="appbar"><h1>Catalogue</h1>
    <input class="search" placeholder="Rechercher une carte…" data-input="q" value="${h(state.q)}">
    <div class="chips">
      <button class="chip ${state.sets.size === 0 ? "on" : ""}" data-action="allsets">Toutes</button>
      ${mainSets.map((s) => `<button class="chip ${state.sets.has(s.code) ? "on" : ""}" data-toggle="sets" data-value="${s.code}">${h(s.name)}</button>`).join("")}
      <button class="chip" data-action="open">+ Filtres${n - state.sets.size > 0 ? ` (${n - state.sets.size})` : ""}</button>
    </div>
    <div class="chips">${Object.entries(SORTS).map(([k, l]) => `<button class="chip ${state.sort === k ? "on" : ""}" data-sort="${k}">${l}</button>`).join("")}</div>
  </div>
  <div class="muted" style="padding:8px 16px">${list.length} versions · page ${state.page}/${pages}</div>
  ${slice.length ? `<div class="listB">${slice.map((p) => {
    const qty = state.collection.get(p.c) || 0;
    return `<div class="rowB" data-open="${h(p.c)}"><img loading="lazy" src="${IMG}small/${p.img}" alt="">
      <div class="mid"><div class="name">${h(p.n)}</div><div class="muted">${h(p.c)} · ${RAR_FR[p.r] || p.r}${p.v ? " · " + (VERS_FR[p.v] || p.v) : ""}</div></div>
      <div class="right"><div class="price">${fmt(displayPrice(p))}</div><div class="muted">${chg(p)}</div>
        <div class="stepper"><button data-wish="${h(p.c)}" style="${state.wishlist.has(p.c) ? "background:var(--accent);color:var(--accent-ink)" : ""}">♡</button><button data-unown="${h(p.c)}">−</button><span>${qty}</span><button data-own="${h(p.c)}">+</button></div></div></div>`;
  }).join("")}</div>` : `<div class="empty">Aucune version ne correspond.<br><button class="btn" data-action="reset">Effacer les filtres</button></div>`}
  <div class="pager"><button data-page="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>‹ Précédente</button>
    <select class="btn" data-input="page">${Array.from({ length: pages }, (_, i) => `<option value="${i + 1}" ${i + 1 === state.page ? "selected" : ""}>Page ${i + 1}</option>`).join("")}</select>
    <button data-page="${state.page + 1}" ${state.page === pages ? "disabled" : ""}>Suivante ›</button></div>
  ${state.panelOpen ? `<div class="scrim" data-action="close"></div><div class="sheet">${filterPanelBody()}</div>` : ""}`;
}

// ---- Variante C : on choisit d'abord l'extension, grille 3 colonnes d'images, tiroir latéral ----
function renderC() {
  const list = filtered(), slice = pageSlice(list), n = activeFilterCount() - state.sets.size;
  const setsShown = DATA.sets.filter((s) => !s.promo || state.showPromos);
  const cur = state.sets.size === 1 ? [...state.sets][0] : null;
  return `
  <div class="appbar"><div class="row"><h1 style="margin:0;flex:1">${cur ? h(DATA.sets.find((s) => s.code === cur).name) : "Toutes les extensions"}</h1>
    <button class="btn" data-action="search">🔍</button><button class="btn" data-action="open">☰${n ? ` ${n}` : ""}</button></div>
    ${state.searchOpen || state.q ? `<input class="search" style="margin-top:8px" placeholder="Rechercher une carte…" data-input="q" value="${h(state.q)}">` : ""}
  </div>
  <div class="setsC"><button class="setC ${!cur ? "on" : ""}" data-action="allsets"><b>Tout</b><small>${DATA.printings.length} versions</small></button>
    ${setsShown.map((s) => `<button class="setC ${cur === s.code ? "on" : ""}" data-set1="${s.code}"><b>${s.code}</b><small>${h(s.name)}</small><small>${s.n} versions</small></button>`).join("")}</div>
  <div class="row muted" style="padding:6px 12px"><span>${list.length} versions</span><span style="margin-left:auto">${sortSelect()}</span></div>
  ${slice.length ? `<div class="gridC">${slice.map((p) => {
    const qty = state.collection.get(p.c) || 0, w = state.wishlist.has(p.c);
    return `<button class="cardC" data-menu="${h(p.c)}">${img(p, "small")}
      <span class="dot">${qty ? `<span style="background:var(--good);color:#041">${qty}</span>` : ""}${w ? `<span style="background:var(--accent);color:var(--accent-ink)">♡</span>` : ""}</span>
      <span class="tag"><span>${h(p.c.split("-").slice(1).join("-"))}</span><b class="price">${fmt(displayPrice(p)).replace(/ .*$/, "")}</b></span></button>`;
  }).join("")}</div>` : `<div class="empty">Aucune version ne correspond.<br><button class="btn" data-action="reset">Effacer les filtres</button></div>`}
  ${pager(list.length)}
  ${state.menu ? (() => { const p = DATA.printings.find((x) => x.c === state.menu); return `<div class="scrim" data-action="closemenu"></div><div class="sheet" style="padding-bottom:90px">
      <div class="row"><img src="${IMG}small/${p.img}" style="width:70px;border-radius:6px"><div><b>${h(p.n)}</b><div class="muted">${h(p.c)} · ${fmt(displayPrice(p))}</div></div></div>
      <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn primary" data-open="${h(p.c)}">Ouvrir la fiche</button><button class="btn" data-own="${h(p.c)}">Possédée +1 (${state.collection.get(p.c) || 0})</button><button class="btn" data-unown="${h(p.c)}">−1</button><button class="btn" data-wish="${h(p.c)}">${state.wishlist.has(p.c) ? "Retirer des souhaits" : "Ajouter aux souhaits"}</button></div></div>`; })() : ""}
  ${state.panelOpen ? `<div class="scrim" data-action="close"></div><div class="drawer">${filterPanelBody()}</div>` : ""}`;
}

// ---- Rendu, événements ----
const RENDER = { A: renderA, B: renderB, C: renderC };
let toastTimer;
function toast(msg) { clearTimeout(toastTimer); document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 1600); }
function render(keepFocus) {
  const focused = keepFocus && document.activeElement?.dataset?.input, pos = document.activeElement?.selectionStart;
  document.getElementById("phone").innerHTML = RENDER[state.variant]();
  document.getElementById("proto").innerHTML = `<button data-cycle="-1">←</button><b>${state.variant}</b> ${VARIANTS[state.variant]}<button data-cycle="1">→</button>
    <select data-input="currency">${Object.keys(CUR_LABEL).map((c) => `<option ${state.currency === c ? "selected" : ""}>${c}</option>`).join("")}</select>
    <select data-input="source"><option value="tcgplayer" ${state.source === "tcgplayer" ? "selected" : ""}>TCGplayer</option><option value="cardmarket" ${state.source === "cardmarket" ? "selected" : ""}>Cardmarket</option></select>`;
  document.getElementById("state").textContent = JSON.stringify({
    variant: state.variant, q: state.q, sets: [...state.sets], promos: state.showPromos, rarities: [...state.rarities], versions: [...state.versions],
    types: [...state.types], domains: [...state.domains], owned: state.owned, prix: [state.priceMin, state.priceMax], sort: state.sort, page: state.page,
    devise: state.currency, source: state.source, collection: Object.fromEntries(state.collection), souhaits: [...state.wishlist],
  }, null, 1);
  if (focused) { const el = document.querySelector(`[data-input="${focused}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
}
function setVariant(v) { state.variant = v; state.menu = null; state.panelOpen = false; const u = new URL(location); u.searchParams.set("variant", v); history.replaceState(null, "", u); render(); }
function cycle(d) { const keys = Object.keys(VARIANTS); setVariant(keys[(keys.indexOf(state.variant) + d + keys.length) % keys.length]); }
function goPage(p) { state.page = p; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-open], [data-action]"); if (!t) return;
  const d = t.dataset;
  if (d.cycle) return cycle(+d.cycle);
  if (d.page) return goPage(+d.page);
  if (d.own) { e.stopPropagation(); state.collection.set(d.own, (state.collection.get(d.own) || 0) + 1); toast(`${d.own} : ×${state.collection.get(d.own)} dans la collection`); return render(); }
  if (d.unown) { e.stopPropagation(); const q = (state.collection.get(d.unown) || 0) - 1; q > 0 ? state.collection.set(d.unown, q) : state.collection.delete(d.unown); return render(); }
  if (d.wish) { e.stopPropagation(); state.wishlist.has(d.wish) ? state.wishlist.delete(d.wish) : state.wishlist.add(d.wish); toast(state.wishlist.has(d.wish) ? "Ajoutée aux souhaits" : "Retirée des souhaits"); return render(); }
  if (d.menu) { state.menu = d.menu; return render(); }
  if (d.toggle) { const s = state[d.toggle]; s.has(d.value) ? s.delete(d.value) : s.add(d.value); state.page = 1; return render(); }
  if (d.owned) { state.owned = d.owned; state.page = 1; return render(); }
  if (d.sort) { state.sort = d.sort; state.page = 1; return render(); }
  if (d.set1) { state.sets = new Set([d.set1]); state.page = 1; return render(); }
  if (d.open) { state.menu = null; render(); return toast(`→ fiche ${d.open} (animation de zoom : prototype suivant)`); }
  switch (d.action) {
    case "open": state.panelOpen = true; return render();
    case "close": state.panelOpen = false; return render();
    case "closemenu": state.menu = null; return render();
    case "reset": resetFilters(); return render();
    case "allsets": state.sets.clear(); state.page = 1; return render();
    case "search": state.searchOpen = !state.searchOpen; render(); return document.querySelector('[data-input="q"]')?.focus();
  }
});
document.addEventListener("change", (e) => {
  const d = e.target.dataset;
  if (d.action === "promos") { state.showPromos = e.target.checked; state.page = 1; return render(); }
  if (d.input === "sort") { state.sort = e.target.value; state.page = 1; return render(); }
  if (d.input === "page") return goPage(+e.target.value);
  if (d.input === "currency") { state.currency = e.target.value; return render(); }
  if (d.input === "source") { state.source = e.target.value; return render(); }
});
document.addEventListener("input", (e) => {
  const k = e.target.dataset.input;
  if (k === "q" || k === "priceMin" || k === "priceMax") { state[k] = e.target.value; state.page = 1; render(true); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
