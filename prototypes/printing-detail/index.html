<!doctype html>
<!-- PROTOTYPE JETABLE — ticket « Prototype de la fiche carte : zoom et graphique de prix ».
     Trois mises en page de la fiche (?variant=A|B|C) × trois styles de zoom (?zoom=shared|grow|fade).
     Données réelles RiftHunt + Cardmarket du 2026-11-07 ; l'HISTORIQUE DES PRIX EST SIMULÉ. Rien n'est persisté. -->
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype fiche carte</title>
<style>
  :root { --bg:#0d1017; --surface:#161b26; --surface2:#1f2533; --text:#e9ecf3; --muted:#8b93a7; --accent:#e0b44c; --accent-ink:#1a1405; --line:#2a3142; --good:#4fbf7f; --bad:#e46a6a; --cm:#6aa6e4; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:#05070b; color:var(--text); font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .phone { max-width:420px; min-height:100vh; margin:0 auto; background:var(--bg); position:relative; }
  .screen { padding-bottom:150px; }
  .appbar { position:sticky; top:0; z-index:5; background:var(--bg); padding:12px 16px 8px; border-bottom:1px solid var(--line); }
  .appbar h1 { font-size:20px; margin:0 0 8px; }
  .search { width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
  .row { display:flex; gap:8px; align-items:center; }
  .btn { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  .btn.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chip { padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface); white-space:nowrap; font-size:13px; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:6px 0; scrollbar-width:none; }
  .muted { color:var(--muted); font-size:13px; }
  .price { font-weight:700; color:var(--accent); }
  .up { color:var(--good); } .down { color:var(--bad); }
  img.art { display:block; width:100%; aspect-ratio:744/1039; object-fit:cover; background:var(--surface2); border-radius:8px; }
  .gridA { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 16px; }
  .cardA { background:var(--surface); border-radius:12px; padding:6px; cursor:pointer; }
  .cardA .name { font-weight:600; font-size:13px; margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cardA .meta { display:flex; justify-content:space-between; font-size:12px; }
  .tabs { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:420px; display:flex; background:var(--surface); border-top:1px solid var(--line); z-index:6; }
  .tabs div { flex:1; text-align:center; padding:10px 0 12px; font-size:12px; color:var(--muted); }
  .tabs div.on { color:var(--accent); font-weight:600; }
  /* Fiche */
  .detail { position:relative; }
  .topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; padding:10px 12px; background:linear-gradient(var(--bg) 70%, transparent); }
  .topbar .title { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .round { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); }
  .section { padding:12px 16px; }
  .section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
  .pricebox { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pcell { background:var(--surface); border-radius:12px; padding:10px; border:2px solid transparent; }
  .pcell.sel { border-color:var(--accent); }
  .pcell .src { font-size:12px; color:var(--muted); }
  .pcell .val { font-size:18px; font-weight:700; }
  .note { font-size:12px; color:var(--muted); margin-top:6px; }
  .actions { position:fixed; bottom:56px; left:50%; transform:translateX(-50%); width:100%; max-width:420px; display:flex; gap:8px; padding:10px 12px; background:var(--surface); border-top:1px solid var(--line); z-index:7; align-items:center; }
  .stepper { display:flex; align-items:center; gap:4px; background:var(--surface2); border-radius:10px; padding:3px; }
  .stepper button { width:34px; height:34px; border:0; border-radius:8px; background:var(--surface); }
  .stepper span { min-width:56px; text-align:center; font-size:13px; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; }
  .facts dt { color:var(--muted); }
  .facts dd { margin:0; }
  .others { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .others button { flex:none; width:84px; border:0; background:none; padding:0; text-align:left; font-size:11px; }
  .others button.cur img { outline:2px solid var(--accent); }
  .tabbar { display:flex; border-bottom:1px solid var(--line); margin:0 16px; }
  .tabbar button { flex:1; border:0; background:none; padding:10px 0; color:var(--muted); border-bottom:2px solid transparent; }
  .tabbar button.on { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .sheetC { position:fixed; left:50%; transform:translateX(-50%); width:100%; max-width:420px; bottom:56px; background:var(--surface); border-radius:18px 18px 0 0; z-index:6; transition:height .3s ease; overflow:auto; box-shadow:0 -8px 30px #0008; }
  .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:8px auto; }
  /* Graphique */
  .chart { position:relative; touch-action:none; user-select:none; }
  .chart svg { display:block; width:100%; height:190px; }
  .tip { position:absolute; top:0; transform:translateX(-50%); background:var(--text); color:var(--bg); font-size:12px; padding:3px 7px; border-radius:6px; white-space:nowrap; pointer-events:none; }
  .custom { display:flex; gap:6px; align-items:center; margin-top:6px; font-size:13px; }
  .custom input { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:4px 6px; }
  /* Zoom */
  .flyer { position:fixed; z-index:50; border-radius:8px; object-fit:cover; pointer-events:none; will-change:transform; }
  .fadein { animation:fadein .28s ease both; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  .hide { visibility:hidden; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:180px; background:var(--text); color:var(--bg); padding:8px 14px; border-radius:10px; z-index:60; font-size:14px; }
  /* Barre du prototype */
  .proto { position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:70; display:flex; gap:5px; align-items:center; background:#fff; color:#111; padding:5px 7px; border-radius:999px; box-shadow:0 4px 18px #000a; font-size:12px; white-space:nowrap; }
  .proto button, .proto select { border:0; background:#eee; border-radius:999px; padding:4px 8px; color:#111; font-size:12px; }
  .state { position:fixed; bottom:0; right:0; z-index:71; max-width:260px; background:#fff; color:#111; font:11px/1.3 ui-monospace,monospace; padding:6px 8px; border-top-left-radius:8px; opacity:.9; white-space:pre-wrap; }
  @media (max-width:900px) { .state { display:none; } .proto { top:auto; bottom:122px; } }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const IMG = "https://images.rifthunt.com/cards/";
const RATES_FROM_USD = { USD:1, CAD:1.4066, EUR:0.89566 }; // Frankfurter 2026-11-06 (le taux historique est simulé à ±4 %)
const CUR = { CAD:"$ CA", USD:"$ US", EUR:"€" };
const NATIVE = { tcgplayer:"USD", cardmarket:"EUR" };
const SRC_FR = { tcgplayer:"TCGplayer", cardmarket:"Cardmarket" };
const VARIANTS = { A:"Image en haut, défilement", B:"En-tête compact + onglets", C:"Image plein écran + panneau" };
const ZOOMS = { shared:"Zoom partagé", grow:"Agrandissement + fondu", fade:"Fondu simple" };
const RAR_FR = { common:"Commune", uncommon:"Peu commune", rare:"Rare", epic:"Épique", showcase:"Showcase", promo:"Promo" };
const VERS_FR = { alternate:"Alternative", overnumbered:"Overnumbered", signature:"Signée", metal:"Metal" };
const PERIODS = { "7":"7 j", "30":"30 j", "90":"90 j", "365":"1 an", all:"Tout", custom:"Dates…" };
const TODAY = new Date("2026-11-07T12:00:00Z");
const DAY = 86400000;

const params = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS[params.get("variant")] ? params.get("variant") : "A",
  zoom: ZOOMS[params.get("zoom")] ? params.get("zoom") : "shared",
  history: "year", // year = 400 j simulés ; fresh = installée il y a 3 j
  currency:"CAD", source:"tcgplayer", q:"",
  open:null, finish:null, period:"30", from:"", to:"", compare:false, tab:"prix", sheetOpen:false,
  collection:new Map([["OGN-030a", 1]]), wishlist:new Map(), binder:new Set(),
};

// ---- Logique (domain/ plus tard) ----
const byCode = new Map(DATA.printings.map((p) => [p.c, p]));
const refFinish = (p) => p.f.includes("normal") ? "normal" : (p.f.includes("foil") ? "foil" : null);
function toDisplay(v, src, rateFactor = 1) {
  if (v == null) return null;
  const usd = NATIVE[src] === "USD" ? v : v / RATES_FROM_USD.EUR;
  return usd * RATES_FROM_USD[state.currency] * rateFactor;
}
const fmt = (v, cur = state.currency) => v == null ? "—" : v.toLocaleString("fr-FR", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " " + CUR[cur];
const fmtDate = (d) => d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit", year:"2-digit" });
function seeded(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
// Historique SIMULÉ : marche aléatoire qui aboutit au prix réel d'aujourd'hui ; un point seulement quand la valeur change.
function priceHistory(p, src, finish) {
  const now = p.px[src][finish]; if (now == null) return [];
  const days = state.history === "year" ? 400 : 3;
  const rnd = seeded(p.c + src + finish), pts = [];
  let v = now;
  for (let i = 0; i <= days; i++) {
    const date = new Date(TODAY - i * DAY);
    pts.push({ date, v: Math.round(v * 100) / 100 });
    if (rnd() < 0.55) v = Math.max(0.05, v * (1 + (rnd() - 0.52) * 0.09));
  }
  pts.reverse();
  return pts.filter((pt, i) => i === 0 || i === pts.length - 1 || pt.v !== pts[i - 1].v);
}
const rateFactorAt = (date) => 1 + 0.04 * Math.sin((TODAY - date) / DAY / 60); // taux du jour du point (simulé)
function periodRange() {
  if (state.period === "custom") return [state.from ? new Date(state.from) : new Date(TODAY - 90 * DAY), state.to ? new Date(state.to + "T23:59:59") : TODAY];
  if (state.period === "all") return [new Date(0), TODAY];
  return [new Date(TODAY - +state.period * DAY), TODAY];
}
function series(p, src, finish) {
  const [from, to] = periodRange(), all = priceHistory(p, src, finish);
  if (!all.length) return [];
  const before = all.filter((pt) => pt.date < from).pop();
  const inside = all.filter((pt) => pt.date >= from && pt.date <= to);
  const pts = (before ? [{ date: from, v: before.v }] : []).concat(inside);
  if (pts.length && pts[pts.length - 1].date < to) pts.push({ date: to, v: pts[pts.length - 1].v });
  return pts.map((pt) => ({ date: pt.date, v: toDisplay(pt.v, src, rateFactorAt(pt.date)) }));
}
function change(pts) { if (pts.length < 2) return null; const a = pts[0].v, b = pts[pts.length - 1].v; return ((b - a) / a) * 100; }
const otherVersions = (p) => p.o ? DATA.printings.filter((x) => x.o === p.o) : [p];

// ---- Rendu partagé ----
const h = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
function chartSvg(p) {
  const fin = state.finish, main = series(p, state.source, fin);
  const otherSrc = state.source === "tcgplayer" ? "cardmarket" : "tcgplayer";
  const other = state.compare ? series(p, otherSrc, fin) : [];
  if (main.length < 2) {
    return `<div class="muted" style="padding:30px 0;text-align:center">${p.px[state.source][fin] == null ? `Pas de prix ${SRC_FR[state.source]} pour cette version.` : "Historique en cours de constitution : le graphique apparaîtra après quelques jours de relevés."}</div>`;
  }
  const W = 360, H = 190, padL = 6, padR = 6, padT = 26, padB = 22;
  const all = main.concat(other), t0 = +main[0].date, t1 = +main[main.length - 1].date;
  let lo = Math.min(...all.map((x) => x.v)), hi = Math.max(...all.map((x) => x.v)); if (hi - lo < 0.01) { hi += 0.5; lo = Math.max(0, lo - 0.5); }
  const X = (d) => padL + ((+d - t0) / Math.max(1, t1 - t0)) * (W - padL - padR);
  const Y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const path = (pts) => pts.map((pt, i) => (i ? "H" + X(pt.date).toFixed(1) + "V" : "M" + X(pt.date).toFixed(1) + ",") + Y(pt.v).toFixed(1)).join("");
  const ch = change(main), color = ch >= 0 ? "var(--good)" : "var(--bad)";
  window.__chart = { main, X, Y, W };
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <text x="${padL}" y="14" fill="var(--muted)" font-size="11">${fmt(hi)}</text>
      <text x="${padL}" y="${H - 6}" fill="var(--muted)" font-size="11">${fmtDate(main[0].date)}</text>
      <text x="${W - padR}" y="${H - 6}" fill="var(--muted)" font-size="11" text-anchor="end">${fmtDate(main[main.length - 1].date)}</text>
      <line x1="${padL}" x2="${W - padR}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
      ${other.length > 1 ? `<path d="${path(other)}" fill="none" stroke="var(--cm)" stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>` : ""}
      <path d="${path(main)}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
      <line id="cursor" y1="${padT}" y2="${H - padB}" stroke="var(--text)" stroke-width="1" opacity="0" vector-effect="non-scaling-stroke"/>
    </svg><div class="tip" id="tip" hidden></div>`;
}
function chartBlock(p) {
  const fin = state.finish, main = series(p, state.source, fin), ch = change(main);
  return `<div class="section"><h2>Évolution du prix</h2>
    <div class="row" style="justify-content:space-between"><span>${SRC_FR[state.source]} · ${fin === "foil" ? "Foil" : "Normale"}</span>
      <b class="${ch >= 0 ? "up" : "down"}">${ch == null ? "" : (ch >= 0 ? "+" : "") + ch.toLocaleString("fr-FR", { maximumFractionDigits:1 }) + " %"}</b></div>
    <div class="chart" id="chart">${chartSvg(p)}</div>
    <div class="chips">${Object.entries(PERIODS).map(([k, l]) => `<button class="chip ${state.period === k ? "on" : ""}" data-period="${k}">${l}</button>`).join("")}</div>
    ${state.period === "custom" ? `<div class="custom">Du <input type="date" data-input="from" value="${state.from}" max="2026-11-07"> au <input type="date" data-input="to" value="${state.to}" max="2026-11-07"></div>` : ""}
    <label class="row muted" style="margin-top:6px"><input type="checkbox" data-action="compare" ${state.compare ? "checked" : ""}> Comparer avec ${SRC_FR[state.source === "tcgplayer" ? "cardmarket" : "tcgplayer"]} (pointillés)</label>
    <div class="note">Chaque point est converti au taux de change de sa date.${state.history === "year" ? " Historique simulé pour le prototype." : ""}</div></div>`;
}
function priceBlock(p) {
  const fins = p.f.length ? p.f : ["normal"];
  const cells = [];
  for (const src of ["tcgplayer", "cardmarket"]) for (const fin of fins) {
    const native = p.px[src][fin], sel = src === state.source && fin === state.finish;
    cells.push(`<button class="pcell ${sel ? "sel" : ""}" data-pick="${src}|${fin}" style="text-align:left">
      <div class="src">${SRC_FR[src]} · ${fin === "foil" ? "Foil" : "Normale"}</div>
      <div class="val ${sel ? "price" : ""}">${fmt(toDisplay(native, src))}</div>
      <div class="note" style="margin:0">${native == null ? "pas de prix" : fmt(native, NATIVE[src]) + (NATIVE[src] !== state.currency ? " d'origine" : "")}</div></button>`);
  }
  return `<div class="section"><h2>Prix</h2><div class="pricebox">${cells.join("")}</div>
    <div class="note">Relevé le ${state.source === "tcgplayer" ? "06/11 (TCGplayer)" : "07/11 (Cardmarket)"} · converti au taux du 06/11.${state.source === "cardmarket" ? "<br>Cardmarket : prix toutes langues et tous états confondus." : ""}</div></div>`;
}
function wishBlock(p) {
  const since = state.wishlist.get(p.c); if (!since) return "";
  const pts = priceHistory(p, state.source, state.finish), at = pts.filter((pt) => pt.date >= since)[0] || pts[pts.length - 1];
  const now = p.px[state.source][state.finish]; if (!at || now == null) return "";
  const c = ((now - at.v) / at.v) * 100;
  return `<div class="section"><div class="pcell"><div class="src">Dans tes souhaits depuis le ${fmtDate(since)}</div><div class="val ${c >= 0 ? "up" : "down"}">${c >= 0 ? "+" : ""}${c.toLocaleString("fr-FR", { maximumFractionDigits:1 })} % depuis l'ajout</div></div></div>`;
}
function factsBlock(p) {
  const set = DATA.sets.find((s) => s.code === p.s);
  return `<div class="section"><h2>Détails</h2><dl class="facts">
    <dt>Extension</dt><dd>${h(set?.name)} (${p.s})</dd><dt>Numéro</dt><dd>${h(p.c)}</dd>
    <dt>Rareté</dt><dd>${RAR_FR[p.r] || h(p.r)}</dd><dt>Version</dt><dd>${p.v ? VERS_FR[p.v] || h(p.v) : "Normale"}</dd>
    <dt>Type</dt><dd>${h(p.t)}</dd><dt>Domaines</dt><dd>${p.d.map((d) => d[0].toUpperCase() + d.slice(1)).join(", ") || "—"}</dd>
    <dt>Finitions</dt><dd>${p.f.map((f) => f === "foil" ? "Foil" : "Normale").join(", ") || "—"}</dd><dt>Artiste</dt><dd>${h(p.a) || "—"}</dd></dl></div>`;
}
function othersBlock(p) {
  const list = otherVersions(p); if (list.length < 2) return "";
  return `<div class="section"><h2>Autres versions (${list.length})</h2><div class="others">${list.map((x) => `<button class="${x.c === p.c ? "cur" : ""}" data-goto="${h(x.c)}"><img class="art" loading="lazy" src="${IMG}small/${x.img}"><div>${h(x.c)}</div><div class="price">${fmt(toDisplay(x.px[state.source][refFinish(x)], state.source))}</div></button>`).join("")}</div></div>`;
}
function actionsBar(p) {
  const qty = state.collection.get(p.c) || 0;
  return `<div class="actions"><div class="stepper"><button data-qty="-1">−</button><span>${qty ? "×" + qty + " possédée" + (qty > 1 ? "s" : "") : "Non possédée"}</span><button data-qty="1">+</button></div>
    <button class="btn ${state.wishlist.has(p.c) ? "on" : ""}" data-action="wish" title="Liste de souhaits">♡</button>
    <button class="btn ${state.binder.has(p.c) ? "on" : ""}" data-action="binder" title="Classeur" style="flex:1">${state.binder.has(p.c) ? "Dans le classeur" : "+ Classeur"}</button></div>`;
}
const topbar = (p, extra = "") => `<div class="topbar"><button class="round" data-action="back">←</button><div class="title">${extra}</div><button class="round" data-action="share" title="Ouvrir sur la place de marché">↗</button></div>`;

// ---- Variante A : grande image en haut, tout se lit en défilant ----
function detailA(p) {
  return `<div class="detail">${topbar(p)}
    <div style="padding:0 40px"><img id="hero" class="art" src="${IMG}normal/${p.img}" style="border-radius:14px"></div>
    <div class="section"><div style="font-size:21px;font-weight:700">${h(p.n)}</div><div class="muted">${h(p.c)} · ${RAR_FR[p.r] || p.r}${p.v ? " · " + (VERS_FR[p.v] || p.v) : ""}</div>
      <div class="price" style="font-size:26px;margin-top:6px">${fmt(toDisplay(p.px[state.source][state.finish], state.source))}</div></div>
    ${wishBlock(p)}${chartBlock(p)}${priceBlock(p)}${othersBlock(p)}${factsBlock(p)}</div>${actionsBar(p)}`;
}
// ---- Variante B : en-tête compact image + infos, onglets Prix / Détails / Versions ----
function detailB(p) {
  const tabs = { prix:"Prix", details:"Détails", versions:"Versions" };
  const body = state.tab === "prix" ? wishBlock(p) + chartBlock(p) + priceBlock(p) : state.tab === "details" ? factsBlock(p) : (othersBlock(p) || `<div class="section muted">Aucune autre version.</div>`);
  return `<div class="detail">${topbar(p, h(p.n))}
    <div class="row section" style="align-items:flex-start"><img id="hero" class="art" src="${IMG}normal/${p.img}" style="width:132px;flex:none">
      <div><div style="font-size:18px;font-weight:700">${h(p.n)}</div><div class="muted">${h(p.c)}</div><div class="muted">${RAR_FR[p.r] || p.r}${p.v ? " · " + (VERS_FR[p.v] || p.v) : ""}</div>
        <div class="price" style="font-size:24px;margin-top:10px">${fmt(toDisplay(p.px[state.source][state.finish], state.source))}</div><div class="muted">${SRC_FR[state.source]} · ${state.finish === "foil" ? "Foil" : "Normale"}</div></div></div>
    <div class="tabbar">${Object.entries(tabs).map(([k, l]) => `<button class="${state.tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>
    ${body}</div>${actionsBar(p)}`;
}
// ---- Variante C : l'image occupe l'écran, un panneau se tire vers le haut ----
function detailC(p) {
  return `<div class="detail" style="min-height:100vh">${topbar(p)}
    <div style="padding:0 16px"><img id="hero" class="art" src="${IMG}large/${p.img}" style="border-radius:16px"></div>
    <div class="sheetC" style="height:${state.sheetOpen ? "72vh" : "150px"}"><div class="grab" data-action="sheet"></div>
      <div class="row section" style="padding-top:0" data-action="sheet"><div style="flex:1"><div style="font-weight:700">${h(p.n)}</div><div class="muted">${h(p.c)} · ${RAR_FR[p.r] || p.r}</div></div>
        <div style="text-align:right"><div class="price" style="font-size:20px">${fmt(toDisplay(p.px[state.source][state.finish], state.source))}</div><div class="muted">${state.sheetOpen ? "▾ réduire" : "▴ prix et graphique"}</div></div></div>
      ${state.sheetOpen ? wishBlock(p) + chartBlock(p) + priceBlock(p) + othersBlock(p) + factsBlock(p) + `<div style="height:80px"></div>` : ""}</div></div>${actionsBar(p)}`;
}
const DETAIL = { A:detailA, B:detailB, C:detailC };

// ---- Grille (variante A retenue au ticket précédent, simplifiée) ----
function gridHtml() {
  const q = state.q.trim().toLowerCase();
  const list = DATA.printings.filter((p) => !["OGS","OPP","PR","JDG","SGN","RWB"].includes(p.s) && (q ? p.n.toLowerCase().includes(q) : p.v === "alternate" || p.r === "showcase"))
    .sort((a, b) => (b.usd ?? -1) - (a.usd ?? -1)).slice(0, 24);
  return `<div class="appbar"><h1>Catalogue</h1><input class="search" placeholder="Rechercher une carte… (ex. jinx)" data-input="q" value="${h(state.q)}">
    <div class="muted" style="margin-top:6px">${q ? "Résultats" : "Showcase les plus chères"} · touche une carte</div></div>
    <div class="gridA">${list.map((p) => `<div class="cardA" data-card="${h(p.c)}"><img class="art" loading="lazy" src="${IMG}normal/${p.img}">
      <div class="name">${h(p.n)}</div><div class="meta"><span class="muted">${h(p.c)}</span><span class="price">${fmt(toDisplay(p.px[state.source][refFinish(p)], state.source))}</span></div></div>`).join("")}</div>`;
}

// ---- Navigation + animations de zoom ----
const gridEl = document.getElementById("grid"), detailEl = document.getElementById("detail");
let origin = null;
function renderDetail() {
  const p = byCode.get(state.open);
  const y = window.scrollY;
  detailEl.innerHTML = DETAIL[state.variant](p);
  window.scrollTo(0, y);
  bindChart(p);
  renderProto();
}
function renderGrid() { gridEl.innerHTML = gridHtml(); renderProto(); }
function flyer(src, rect) {
  const f = document.createElement("img"); f.className = "flyer"; f.src = src;
  Object.assign(f.style, { left: rect.left + "px", top: rect.top + "px", width: rect.width + "px", height: rect.height + "px" });
  document.body.appendChild(f); return f;
}
function animateTo(f, from, to, ms) {
  const dx = to.left - from.left, dy = to.top - from.top, sx = to.width / from.width, sy = to.height / from.height;
  return f.animate([{ transform: "none" }, { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` }], { duration: ms, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }).finished;
}
async function openCard(code, cardEl) {
  const p = byCode.get(code), fromImg = cardEl.querySelector("img");
  origin = { code, scroll: window.scrollY };
  state.open = code; state.finish = refFinish(p) || "normal"; state.tab = "prix"; state.sheetOpen = false;
  const from = fromImg.getBoundingClientRect();
  if (state.zoom === "fade") {
    gridEl.hidden = true; detailEl.hidden = false; window.scrollTo(0, 0); renderDetail(); detailEl.classList.remove("fadein"); void detailEl.offsetWidth; detailEl.classList.add("fadein"); return;
  }
  const f = flyer(fromImg.src, from);
  fromImg.classList.add("hide");
  gridEl.hidden = true; detailEl.hidden = false; window.scrollTo(0, 0); renderDetail();
  const hero = document.getElementById("hero"); hero.classList.add("hide");
  if (state.zoom === "shared") {
    await animateTo(f, from, hero.getBoundingClientRect(), 340);
  } else { // grow : la carte grossit au centre, la fiche apparaît en fondu derrière
    detailEl.classList.remove("fadein"); void detailEl.offsetWidth; detailEl.classList.add("fadein");
    const w = Math.min(window.innerWidth, 420) * 0.8, hh = w * 1039 / 744;
    await animateTo(f, from, { left: (window.innerWidth - w) / 2, top: (window.innerHeight - hh) / 2, width: w, height: hh }, 260);
    await f.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: "forwards" }).finished;
  }
  hero.classList.remove("hide"); fromImg.classList.remove("hide"); f.remove();
}
async function back() {
  const hero = document.getElementById("hero");
  const code = origin?.code;
  const finish = () => { detailEl.hidden = true; gridEl.hidden = false; window.scrollTo(0, origin?.scroll || 0); state.open = null; renderProto(); };
  if (state.zoom !== "shared" || !hero || !code) { finish(); gridEl.classList.remove("fadein"); void gridEl.offsetWidth; gridEl.classList.add("fadein"); return; }
  const from = hero.getBoundingClientRect(), f = flyer(hero.src, from); hero.classList.add("hide");
  finish();
  const target = gridEl.querySelector(`[data-card="${CSS.escape(code)}"] img`);
  if (!target) return f.remove();
  target.classList.add("hide");
  await animateTo(f, from, target.getBoundingClientRect(), 300);
  target.classList.remove("hide"); f.remove();
}

// ---- Graphique : pointeur tactile ----
function bindChart(p) {
  const el = document.getElementById("chart"); if (!el || !window.__chart) return;
  const svg = el.querySelector("svg"); if (!svg) return;
  const tip = document.getElementById("tip"), cursor = document.getElementById("cursor");
  const move = (e) => {
    const { main, X, W } = window.__chart, r = svg.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * W;
    let best = main[0]; for (const pt of main) if (X(pt.date) <= x) best = pt;
    cursor.setAttribute("x1", X(best.date)); cursor.setAttribute("x2", X(best.date)); cursor.setAttribute("opacity", 1);
    tip.hidden = false; tip.style.left = Math.min(Math.max(50, (X(best.date) / W) * r.width), r.width - 50) + "px";
    tip.textContent = `${fmtDate(best.date)} · ${fmt(best.v)}`;
  };
  svg.addEventListener("pointerdown", (e) => { svg.setPointerCapture(e.pointerId); move(e); });
  svg.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) move(e); });
  svg.addEventListener("pointerleave", () => { tip.hidden = true; cursor.setAttribute("opacity", 0); });
}

// ---- Barre du prototype + état ----
function renderProto() {
  document.getElementById("proto").innerHTML = `
    <button data-cycle="-1">←</button><b>${state.variant}</b> ${VARIANTS[state.variant]}<button data-cycle="1">→</button>
    <select data-input="zoom">${Object.entries(ZOOMS).map(([k, l]) => `<option value="${k}" ${state.zoom === k ? "selected" : ""}>${l}</option>`).join("")}</select>
    <select data-input="history"><option value="year" ${state.history === "year" ? "selected" : ""}>Historique 1 an</option><option value="fresh" ${state.history === "fresh" ? "selected" : ""}>Installée il y a 3 j</option></select>
    <select data-input="currency">${Object.keys(CUR).map((c) => `<option ${state.currency === c ? "selected" : ""}>${c}</option>`).join("")}</select>
    <select data-input="source"><option value="tcgplayer" ${state.source === "tcgplayer" ? "selected" : ""}>TCG</option><option value="cardmarket" ${state.source === "cardmarket" ? "selected" : ""}>CM</option></select>`;
  document.getElementById("state").textContent = JSON.stringify({ variant: state.variant, zoom: state.zoom, ouverte: state.open, finition: state.finish, source: state.source, devise: state.currency,
    periode: state.period, du: state.from, au: state.to, comparer: state.compare, onglet: state.tab, panneau: state.sheetOpen,
    collection: Object.fromEntries(state.collection), souhaits: [...state.wishlist.keys()], classeur: [...state.binder] }, null, 1);
}
function updateUrl() { const u = new URL(location); u.searchParams.set("variant", state.variant); u.searchParams.set("zoom", state.zoom); history.replaceState(null, "", u); }
function cycle(d) { const k = Object.keys(VARIANTS); state.variant = k[(k.indexOf(state.variant) + d + k.length) % k.length]; updateUrl(); state.open ? renderDetail() : renderProto(); }
function toast(msg) { document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1700); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-card], [data-action]"); if (!t) return;
  const d = t.dataset;
  if (d.cycle) return cycle(+d.cycle);
  if (d.card) return openCard(d.card, t);
  const p = state.open && byCode.get(state.open);
  if (d.period) { state.period = d.period; return renderDetail(); }
  if (d.pick) { [state.source, state.finish] = d.pick.split("|"); return renderDetail(); }
  if (d.tab) { state.tab = d.tab; return renderDetail(); }
  if (d.goto) { state.open = d.goto; state.finish = refFinish(byCode.get(d.goto)) || "normal"; window.scrollTo(0, 0); return renderDetail(); }
  if (d.qty) { const q = Math.max(0, (state.collection.get(p.c) || 0) + +d.qty); q ? state.collection.set(p.c, q) : state.collection.delete(p.c); return renderDetail(); }
  switch (d.action) {
    case "back": return back();
    case "wish": state.wishlist.has(p.c) ? state.wishlist.delete(p.c) : state.wishlist.set(p.c, new Date(TODAY - 21 * DAY)); toast(state.wishlist.has(p.c) ? "Ajoutée aux souhaits (date d'ajout simulée : il y a 21 j)" : "Retirée des souhaits"); return renderDetail();
    case "binder": state.binder.has(p.c) ? state.binder.delete(p.c) : state.binder.add(p.c); return renderDetail();
    case "sheet": state.sheetOpen = !state.sheetOpen; return renderDetail();
    case "share": return toast(`→ ouvrirait ${SRC_FR[state.source]} dans le navigateur`);
  }
});
document.addEventListener("change", (e) => {
  const d = e.target.dataset;
  if (d.action === "compare") { state.compare = e.target.checked; return renderDetail(); }
  if (d.input === "zoom") { state.zoom = e.target.value; updateUrl(); return renderProto(); }
  if (["history", "currency", "source"].includes(d.input)) { state[d.input] = e.target.value; if (d.input === "source" && state.open) state.finish = state.finish; state.open ? renderDetail() : renderGrid(); return; }
  if (d.input === "from" || d.input === "to") { state[d.input] = e.target.value; return renderDetail(); }
});
document.addEventListener("input", (e) => { if (e.target.dataset.input === "q") { state.q = e.target.value; const pos = e.target.selectionStart; renderGrid(); const el = document.querySelector('[data-input="q"]'); el.focus(); el.setSelectionRange(pos, pos); } });
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1); if (e.key === "Escape" && state.open) back();
});
renderGrid();
</script>
</body>
</html>
